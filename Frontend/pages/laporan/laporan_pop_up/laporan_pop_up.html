<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapor Barang - Temu Kembali</title>
    <!-- Asumsi kamu punya style global -->
    <!-- <link rel="stylesheet" href="../../core/css/style.css"> -->
    <link rel="stylesheet" href="laporan.css">
</head>
<body>
    <!-- Navbar sederhana untuk navigasi -->
    <nav class="navbar">
        <div class="logo">Temu Kembali</div>
        <a href="../../index.html">Kembali ke Beranda</a>
    </nav>

    <div class="container-laporan">
        <h2>Buat Laporan</h2>
        
        <!-- Tab Pilihan -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-hilang" onclick="switchTab('hilang')">Saya Kehilangan</button>
            <button class="tab-btn" id="tab-nemu" onclick="switchTab('nemu')">Saya Menemukan</button>
        </div>

        <form id="form-laporan">
            <!-- Tipe Laporan (Hidden) -->
            <input type="hidden" id="tipe-laporan" value="Hilang">

            <!-- Area Upload Foto di Paling Atas (Sesuai Request) -->
            <div class="form-group foto-upload-area">
                <label for="foto-barang" id="foto-label">
                    <span class="icon-plus">+</span>
                    <p>Klik untuk unggah foto barang</p>
                </label>
                <input type="file" id="foto-barang" accept="image/png, image/jpeg" onchange="previewImage(event)">
                <img id="preview-foto" src="" alt="Preview" style="display: none;">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="nama-barang" placeholder="Contoh: Dompet cokelat" required>
                </div>
                <div class="form-group">
                    <label>Jenis Barang</label>
                    <select id="jenis-barang" required>
                        <option value="">Pilih jenis...</option>
                        <option value="Elektronik">Elektronik</option>
                        <option value="Dompet/Tas">Dompet/Tas</option>
                        <option value="Dokumen">Dokumen</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tanggal Kejadian</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label>Lokasi</label>
                    <input type="text" id="lokasi" placeholder="Contoh: Perpustakaan Lantai 2" required>
                </div>
            </div>

            <!-- Field khusus "Saya Menemukan" (Awalnya disembunyikan) -->
            <div class="form-group" id="field-penitipan" style="display: none;">
                <label>Barang sekarang di mana?</label>
                <select id="penitipan">
                    <option value="">Pilih lokasi penitipan...</option>
                    <option value="Pos Satpam Depan">Pos Satpam Depan</option>
                    <option value="Tata Usaha">Tata Usaha Fakultas</option>
                    <option value="Bawa Sendiri">Saya bawa sendiri</option>
                </select>
            </div>

            <div class="form-group">
                <label>Deskripsi Umum</label>
                <textarea id="deskripsi" rows="3" placeholder="Warna, merek, ukuran, kondisi..." required></textarea>
            </div>

            <div class="form-group">
                <label>Ciri Rahasia (Untuk Verifikasi)</label>
                <textarea id="ciri-rahasia" rows="2" placeholder="Isi barang, goresan, stiker (Tidak dipublikasikan)"></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Laporan</button>
        </form>
    </div>

    <script src="laporan.js"></script>
</body>
</html>
