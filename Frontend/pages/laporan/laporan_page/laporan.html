<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daftar barang hilang dan temuan di kampus.">
    <title>Daftar Laporan - LostnFound</title>
    <link rel="stylesheet" href="laporan.css">
</head>
<body>
    <header class="page-nav"><a href="../../../index.html">&larr; Beranda</a></header>
    <main class="container">
        <h1>Laporan terbaru</h1>

        <!-- Kotak Filter Utama -->
        <div class="filter-box">
            <div class="filter-group">
                <label for="filter-jenis">Jenis barang</label>
                <select id="filter-jenis">
                    <option value="Semua">Semua jenis</option>
                    <option value="Aksesoris">Aksesoris</option>
                    <option value="Kendaraan">Kendaraan</option>
                    <option value="Dokumen">Dokumen</option>
                    <option value="Elektronik">Elektronik</option>
                    <option value="Tas">Tas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-lokasi">Lokasi ditemukan</label>
                <select id="filter-lokasi">
                    <option value="Semua">Semua lokasi</option>
                    <option value="Kantin Utama">Kantin Utama</option>
                    <option value="Gedung B">Gedung B</option>
                    <option value="Perpustakaan">Perpustakaan</option>
                    <option value="Lab Komputer">Lab Komputer</option>
                    <option value="Aula">Aula</option>
                    <option value="Parkiran Timur">Parkiran Timur</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-start-date">Dari tanggal</label>
                <input type="date" id="filter-start-date">
            </div>
            <div class="filter-group">
                <label for="filter-end-date">Sampai tanggal</label>
                <input type="date" id="filter-end-date">
            </div>
            <div class="filter-actions">
                <button type="button" class="btn-terapkan" id="btn-terapkan">Terapkan</button>
                <button type="button" class="btn-reset" id="btn-reset">Reset</button>
            </div>
        </div>

        <!-- Info & Filter Status -->
        <p class="summary-text" id="summary-text" role="status" aria-live="polite"></p>
        <div class="status-tabs" role="group" aria-label="Filter status">
            <button type="button" class="status-btn active" data-status="Semua" aria-pressed="true">Semua</button>
            <button type="button" class="status-btn" data-status="Hilang" aria-pressed="false">Hilang</button>
            <button type="button" class="status-btn" data-status="Ditemukan" aria-pressed="false">Ditemukan</button>
            <button type="button" class="status-btn" data-status="Dikembalikan" aria-pressed="false">Dikembalikan</button>
        </div>

        <!-- Grid Container untuk Kartu -->
        <div class="grid-container" id="card-container"></div>

    </main>

    <!-- ================= MODAL POPUP DETAIL ================= -->
    <div id="detail-modal" class="modal-overlay" hidden>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <!-- Tombol Silang untuk Close (X) -->
            <button type="button" class="close-btn" id="modal-close" aria-label="Tutup detail">&times;</button>
            
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="laporan.js"></script>
</body>
</html>
